resources:
  pipelines:
    real_estate_lakehouse:
      name: real_estate_lakehouse
      libraries:
      - glob:
          include: ../real_estate_lakehouse/transformations/**
      catalog: ${var.catalog}
      channel: CURRENT
      continuous: false
      photon: true
      root_path: ../real_estate_lakehouse
      schema: bronze
      serverless: true
      configuration:
        initial_load_path: /Volumes/${var.catalog}/bronze/data_inputs/initial_load/